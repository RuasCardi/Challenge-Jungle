<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160c08" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      if (location.pathname === "/" || location.pathname.startsWith("/nft/")) {
        const artwork = document.createElement("link");
        artwork.rel = "preload";
        artwork.as = "image";
        artwork.href = "/assets/ape-hero.webp";
        artwork.fetchPriority = "high";
        if (location.pathname === "/") {
          artwork.imageSrcset =
            "/assets/ape-hero-200.webp 200w, /assets/ape-hero-300.webp 300w, /assets/ape-hero.webp 447w";
          artwork.imageSizes =
            "(max-width: 650px) 140px, (max-width: 1200px) 40vw, 450px";
        }
        document.head.append(artwork);
      }
    </script>
    <link
      rel="preload"
      href="/assets/roboto-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/ape-sage.webp"
      as="image"
      media="(max-width: 650px)"
      imagesrcset="/assets/ape-sage-200.webp 200w, /assets/ape-sage.webp 249w"
      imagesizes="calc((100vw - 80px) / 2)"
      fetchpriority="high"
    />
    <title>KURIO — Marketplace</title>
    <meta
      name="description"
      content="Explore coleções de arte digital, salve favoritos e experimente uma compra completa de NFTs com carteiras e pagamentos simulados."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
